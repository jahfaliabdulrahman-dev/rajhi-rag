name: publish-guard

# What-if workshop G3 — the published surface needs its own guard:
# any push/PR that would carry personal paths, real account numbers, family
# names, or real-data files fails BEFORE reaching the public.
on:
  push:
  pull_request:

# Read-only token: a guard that only reads must not be handed write scopes,
# and the action is pinned to a commit SHA — a moving tag on the workflow that
# enforces privacy is a supply-chain hole in the one place it hurts most.
permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0   # full history for the forensic scan
      - name: PII / real-data guard (tree + history + commit messages)
        run: python3 tools/publish_guard.py --tree --history --ci
      - name: Real-amount guard (tracked + untracked; Latin/Arabic/Persian digits)
        run: python3 tools/amount_guard.py
      # Static gate: undefined names / dead bindings. Pinned engine so the
      # verdict cannot drift with a version bump; a dev tool, never a runtime
      # dependency.
      - name: Static gate (names that never resolve, bindings never read)
        run: |
          python3 -m pip install --quiet pyflakes==3.4.0
          python3 tools/static_gate.py
      # The derived claims snapshot is only useful if something FAILS when the
      # documents drift from it: a snapshot with no automatic caller rots
      # silently (external audit, 2026-09-18). No local cache in CI — this reads
      # docs/claims.json and asserts the public documents still match it.
      - name: Public claims must match their derived snapshot
        run: python3 tools/render_claims.py --check
      - name: Lightweight suite (no ML deps — compile, lock, public claims, gate injection)
        run: |
          python3 -m pip install --quiet pytest openpyxl==3.1.5
          python3 -m pytest tests/test_compile_all.py \
                           tests/test_requirements_lock.py \
                           tests/test_public_claims.py \
                           tests/test_gate_bites.py -q
      - name: Real-data files must never be tracked
        run: |
          if git ls-files | grep -q '^data/local_sample/'; then
            echo "::error::real statement files tracked under data/local_sample/"; exit 1
          fi
          echo "no real-data files tracked — OK"
