name: publish-guard

# What-if workshop G3 — the published surface needs its own guard:
# any push/PR that would carry personal paths, real account numbers, family
# names, or real-data files fails BEFORE reaching the public.
on:
  push:
  pull_request:

# Read-only token: a guard that only reads must not be handed write scopes,
# and the action is pinned to a commit SHA — a moving tag on the workflow that
# enforces privacy is a supply-chain hole in the one place it hurts most.
permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    # **بيئةُ المهمّة مُعلَنة (R67 · مراجعة ٦٧):** كلُّ خطوةٍ هنا تعمل في هذه المهمّة، وتبعيّاتُها
    # (`pytest openpyxl PyYAML`) تُجمَع أقلَّ من بيئة المالك. **والعددُ لا يُكتب بيدٍ هنا (مقعدُ
    # المواصفة F2 · ٦٨ج):** قيمتُه تُقرأ من `docs/claims.json ⇒ tests_by_env.ci-light` كما تفعل خطوةُ
    # اللقطة — فالصنفُ الذي أُغلق في السطر ٥٢ أُغلق هنا بحذفه لا بحراسته. فالافتراضُ هنا، والاستثناءُ
    # يُعلَن في خطوته (`off`) — فلا تُضاف خطوةٌ جديدةٌ فتقع في بيئةٍ منسوبةٍ خطأً بالصمت.
    env:
      RAJHI_CLAIMS_ENV: ci-light
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0   # full history for the forensic scan
      - name: PII / real-data guard (tree + history + commit messages)
        id: gate_pii
        run: python3 tools/publish_guard.py --tree --history --ci
      - name: Real-amount guard — a public surface without the manifest (declares what it checked)
        id: gate_amount
        env:
          AMOUNT_GUARD_KEY: ${{ secrets.AMOUNT_GUARD_KEY }}
        run: python3 tools/amount_guard.py --ci
      # Static gate: undefined names / dead bindings. Pinned engine so the
      # verdict cannot drift with a version bump; a dev tool, never a runtime
      # dependency.
      - name: Static gate (names that never resolve, bindings never read)
        id: gate_static
        run: |
          python3 -m pip install --quiet pyflakes==3.4.0
          python3 tools/static_gate.py
      # The derived claims snapshot is only useful if something FAILS when the
      # documents drift from it: a snapshot with no automatic caller rots
      # silently (external audit, 2026-09-18). No local cache in CI — this reads
      # docs/claims.json and asserts the public documents still match it.
      - name: Public claims must match their derived snapshot
        id: gate_claims
        # **والخطوةُ **تقيس** — ولا تُسكِت قياسًا مُمكِنًا (مقعدا المعايير والمواصفة · جولة ٦٧):** كان
        # الإعلانُ `off` هنا يُسكِت قياسًا **مُمكِنًا** (‎`pytest` يُثبَّت في السطر التالي!) ⇒ فصار للخطوة
        # مفتاحُها المُعلَن `ci-claims` — **وقيمتُه مؤشّرٌ لا نسخة (مقعدُ المعايير · جولة ٦٨):** كانت هنا
        # قيمةٌ مكتوبةٌ بيدٍ فتقادمت في اللقطة والوثيقة وبقيت هنا ⇒ والآن يُقرأ من
        # `docs/claims.json` ⇒ `tests_by_env.ci-claims` (وخطوةُ «علّم الرقم» تُظهر أيّ انزياح). ويصير
        # `off` ملجأً أخيرًا
        # لا غطاءً. **وحدُّ `off` يبقى مكتوبًا في موضعه:** لا يُستعمل ليُسكِت قياسًا مُمكِنًا.
        env:
          RAJHI_CLAIMS_ENV: ci-claims
        run: |
          # **وتُثبَّت النسخةُ لا تُترك للتحديث (مقعدُ البنية · جولة ٦٧):** العدُّ دالّةٌ في إصدار
          # المفسّر و`pytest` وتبعيّاتِ المهمّة معًا ⇒ فإصدارٌ غيرُ مثبَّتٍ يجعل قيمةَ `ci-claims`
          # تتحرّك بلا كودٍ ⇒ تضبطها ترقيةٌ صامتة. فالمثبَّت هو الذي يُقاس.
          # **وسببُ الفرق الثابت «+10» مقيسٌ الآن (R72-2 · مراجعة ٧٢):** كان يُنسَب إلى المفسّر
          # و`pytest`، والصحيحُ أنّه **تبعيّةُ خطوةٍ سابقة في المهمّة نفسِها**: `pyflakes==3.4.0`
          # تُثبَّت في `gate_static` ⇒ فتصير اختباراتُ `tests/test_static_gate.py` قابلةً للتجميع.
          # قِيس بمستنسخٍ للبيئة (بايثون 3.12.3): نقصُ **عشرةٍ بالضبط** بلا `pyflakes`، وعودتُها به.
          # فمن قاس بلا `pyflakes` ورأى الفرقَ فقد قاس بيئةً أخرى — والقيمُ المطلقةُ في اللقطة لا هنا.
          python3 -m pip install --quiet "pytest==9.1.1"
          # **«علّم الرقمَ» (مراجعة ٦٨ · الملاحظةُ الجانبيّة):** القيمةُ تُقاس هنا وتُعرض وتُفشل عند
          # الانزياح ⇒ فلا يُنقل الرقمُ بالتخمين (كما وقع ثلاثَ مرّاتٍ في جولةٍ واحدة).
          python3 tools/render_claims.py --write
          git diff --exit-code -- docs/claims.json || {
            echo "⛔ اللقطةُ لا تطابق قياسَ بيئة هذه الخطوة (ci-claims) ⇒ خُذ القيمةَ من الفرق أعلاه."; exit 1; }
          python3 tools/render_claims.py --check
      - name: Lightweight suite (no ML deps — compile, lock, public claims, gate injection, memory)
        id: gate_suite
        run: |
          # **وتبعيّاتُ الخطوة مثبَّتةٌ من `requirements.lock` (R72-1 · الشقّ (ب) · مراجعة ٧٢):**
          # `numpy` و`Pillow` أُضيفتا ليُشغَّل هنا حرّاسُ قراءة البيان الثلاثة، وهما ليستا من تعلّم
          # الآلة ⇒ فاسمُ الخطوة «no ML deps» يبقى صادقًا (وهو الاعتراضُ الذي أجابته مراجعة ٧٢ في موضعه).
          # **وحدُّ الذاكرة تحرّك (P-2 · بكلمة المالك · توصيةُ مراجعة ١٠٠):** كان البيانُ هنا
          # بلا `langchain`/`langgraph` ⇒ **كلُّ ضابطِ ذاكرةٍ سلوكيّ يتخطّى**. والآن يُثبَّتان فيصيران
          # يعملان على GitHub لا في جهاز المالك وحده: `test_the_memory_reaches_the_model.py` (**٦**
          # اختبارات كانت تتخطّى — وهي في قائمة هذه الخطوة ⇒ **تجري فعلًا**) و`test_money_string_fields.py`
          # (**٤**، وفي القائمة كذلك). **وعدّادُ هذه البيئة يرتفع بأكثرَ من مجموعهما** لأنّه **جمعٌ كاملٌ
          # لـ`tests/`، لا عدُّ ما نُفِّذ**: فملفٌّ مثل `test_scope_one_home` (**٥**) **صار في القائمة**
          # (بغلقِ ملاحظةٍ من مقعد المواصفة: قاعدةُ المستودع «ما يُعدّ يُشغَّل» — فالوحدةُ والعدّادُ من
          # مصدرٍ واحد) ⇒ فما كان يُجمَع ولا يُشغَّل صار يجري هنا. **والقيمةُ لا تُكتب بيدٍ في تعليق:**
          # مصدرُها مخرَجُ هذه الخطوة (سطرُ «علّم الرقم» أدناه)، ومنقولُها `docs/claims.json` ⇒ اقرأها
          # من اللقطة لا من هنا.
          # **والباقي خارجَ هذه الخطوة مُعلَنٌ باسمه لا مُضمَرٌ:** `test_memory_acceptance_gate.py`
          # (ضابطا R99-1/R99-2 على الـfixture «chat») يستورد الواجهة ⇒ يحتاج `gradio`، وهو **مستبعَدٌ
          # بقرار المالك** («بلا `gradio`») ⇒ فالحدُّ يبقى قائمًا هناك، ويحرسه هنا ضابطُ البنية بالـAST
          # (`test_agent_prompt_memory::test_the_wiring_is_backward_compatible` يقيس موضعَ الكتابة الواحد
          # وغيابَ عَلَم `remember`) — وهو لا يستورد شيئًا ثقيلًا.
          python3 -m pip install --quiet "pytest==9.1.1" openpyxl==3.1.5 PyYAML==6.0.3 \
                                      "numpy==2.4.6" "pillow==12.3.0" \
                                      "langchain==1.4.0" "langchain-core==1.6.3" "langgraph==1.2.11"
          python3 -m pytest tests/test_compile_all.py \
                           tests/test_requirements_lock.py \
                           tests/test_public_claims.py \
                           tests/test_gate_bites.py \
                           tests/test_gate_registry.py \
                           tests/test_secret_scan.py \
                           tests/test_report_names.py \
                           tests/test_turn_derivation.py \
                           tests/test_hook_gates.py \
                           tests/test_static_gate.py \
                           tests/test_amount_guard.py \
                           tests/test_ci_report.py \
                           tests/test_answer_names_witness.py \
                           tests/test_gate_goldens.py \
                           tests/test_gate_flake_policy.py \
                           tests/test_rederive_footer_verdicts.py \
                           tests/test_flake_ledger.py \
                           tests/test_landing_probe.py \
                           tests/test_eval_pack.py \
                           tests/test_local_reader_probe.py \
                           tests/test_publish_guard.py \
                           tests/test_footer_order.py \
                           tests/test_desc_accuracy.py \
                           tests/test_intake.py \
                           tests/test_desc_pass.py \
                           tests/test_desc_reader.py \
                           tests/test_row_bands.py \
                           tests/test_reader_reasoning_retry.py \
                           tests/test_saved_record_mark.py \
                           tests/test_ledger.py \
                           tests/test_ledger_ui.py \
                           tests/test_ledger_search_reach.py \
                           tests/test_answer_type.py \
                           tests/test_date_encoding_filter.py \
                           tests/test_agent_prompt_memory.py \
                           tests/test_app_binds_history.py \
                           tests/test_the_memory_reaches_the_model.py \
                           tests/test_scope_one_home.py \
                           tests/test_app_excel_button.py \
                           tests/test_money_unit.py \
                           tests/test_money_string_fields.py \
          # **وأربعةُ ملفّاتِ أ-٣/أ-٤ دخلت القائمة (مراجعة ٩١ · الإصلاحُ المطلوب ①):** قِيس أنّ
          # العدّادَ يعدّ `tests/` كلَّها بينما **التشغيلُ** يقف على هذه القائمة ⇒ فبقيت اختباراتُ
          # الدفتر (٢٢) تجري هنا ولا تُذكر، **وأيُّ عطبٍ فيها يُخضرّ**. والقاعدة: **القائمةُ والعدّادُ
          # من مصدرٍ واحد** — فما يُعدّ يُشغَّل.
          # **وحرّاسُ جولة البيان الخمسة صاروا في القائمة (R72-1 · مراجعة ٧٢ · شقّاها (أ) و(ب) في هذا
          # الالتزام):** (أ) `test_desc_accuracy.py` · `test_intake.py` تعملان بتبعيّات الخطوة
          # كما كانت، **وإضافةُ ملفٍّ إلى القائمة لا تحرّك العدّاد** (العدُّ يشمل `tests/` كلَّها).
          # (ب) `test_desc_pass.py` · `test_desc_reader.py` · `test_row_bands.py` تحتاج
          # `numpy` و`Pillow` فثُبِّتا في سطر التثبيت أعلاه.
          # **والقياس (مستنسخٌ لبيئة هذه الخطوة: بايثون 3.12.3 · pytest 9.1.1 · openpyxl · PyYAML ·
          # pyflakes · numpy · Pillow):** الملفّان في (أ) **١١ نجحت · ١٣ تُخطّى · ٠ سقطت** (والتخطّي
          # مُعلَنُ السبب في الاختبار نفسه: «حزمة التطبيق غير مثبّتة هنا (CI خفيف)»)، والثلاثة في (ب)
          # **٣٥ نجحت · ٠ سقطت**.
          # **والأعدادُ تُنسب إلى بيئتها (R73-3 · مراجعة ٧٣):** هذان رقمان مُقاسان في مستنسخٍ على جهاز
          # المالك، وأُعيد قياسُهما في **نسخةٍ نظيفة** فجاءا حرفيًّا كذلك. أمّا **المجموعُ في هذه الخطوة
          # فمن مخرَجها هي** (والفارقُ عن نسختي **أحدَ عشرَ** اختبارًا، كلُّه في `test_amount_guard.py`:
          # يحتاج المانيفستَ والمفتاح، و`_data_root()` في `tools/amount_guard.py` يُحلّ عبر
          # `git --git-common-dir` ⇒ فتراهما شجرةُ العمل ولا تراهما نسخةٌ نظيفة، فتسقط هناك).
          # **وأثرُ (ب) على العدّاد:** تثبيتُ تبعيّةٍ في هذه الخطوة **يرفع ما يُجمَع** (وإضافةُ ملفٍّ لا
          # ترفعه) ⇒ فتُحدَّث اللقطةُ بأداة الدعاوى في وضع الكتابة (`render_claims --write`) **من هذه
          # البيئة نفسِها**، ويُحدَّث سطرُ
          # `docs/QA_CHECKLIST.md`، وإلّا حمرّت خطوةُ «علّم الرقم» أدناه. **والقيمُ من `docs/claims.json`
          # لا من هذا التعليق** (قاعدةُ هذا الملفّ: العددُ لا يُكتب بيدٍ هنا).
          # **ولا يُكتب عددُ الباقي خارجَ القائمة (R84-2 · R86-4):** كان رقمًا مكتوبًا بيدٍ يتقادم
          # صامتًا — وقِيس ٤٨ ثمّ ٤٧ في التزامٍ واحد ⇒ فالعددُ يُقرأ من `--collect-only`، لا من تعليق.
          # `test_parser.py` · `test_reader_stamp_and_contract.py` · `test_text_reader.py`) — والقائمةُ
          # المقيسة في §٣ من `docs/GATES.md`، وهي المقابَلُ في الاتّجاهين.
          #
          # **وحدُّ القارئ مُعلَن (قاسه مقعدُ المعايير · مراجعةُ هذه الجولة):** قارئُ القائمة في
          # `test_gate_registry.py` يستخرج كلَّ ما يطابق نمطَ اسمِ ملفّ اختبار **من نصّ هذا الملفّ
          # كلِّه**، ومنه التعليقات. فذكرُ مسارٍ في نثرٍ هنا يُقرأ **إدراجًا** ⇒ ولذلك تُذكر أسماءُ هذه
          # الملفّات في **سطور التشغيل وحدَها** ولا تُسمّى بمسارها في تعليق (وأسماءُ ما ليس في القائمة
          # تُذكر بلا مسار: فلا يُقرأ إدراجٌ وهميّ).
          # **«علّم الرقمَ» (مراجعة ٦٨ · الملاحظةُ الجانبيّة):** كلُّ ضابطٍ جديدٍ يُحرّك العدّاد، وكان
          # تحديثُ قيمة البيئة يتمّ بيدٍ من تخمين (وقع ثلاثَ مرّاتٍ في جولةٍ واحدة). فهذان السطرانِ
          # **يُنتجان القيمةَ من قياس هذه البيئة** ويعرضان الفرقَ ويفشلان ⇒ فيُنسخ الرقمُ من مخرَج
          # الـCI نفسِه (وهو في الوقت نفسه برهانٌ حيٌّ أنّ الكاتبَ لا يمحو مفاتيحَ البيئات).
          python3 tools/render_claims.py --write
          git diff --exit-code -- docs/claims.json || {
            echo "⛔ اللقطةُ لا تطابق قياسَ بيئة هذه الخطوة ⇒ خُذ القيمَ من الفرق أعلاه، الصقها في docs/claims.json ثم أعد الدفع."; exit 1; }
      # P-11 (مراجعة ٥٩ · بقرار المالك): **قِس الثابتَ لا العدّادات.** ثلاثةُ إصلاحاتٍ للصنف نفسه
      # (R57-1 حارسُ المكان · R58-1 عدّادُ الكشيدة · R59-1 ضابطُ مواضع النثر) سقط كلٌّ منها في
      # جولة، لأن **نصَّ المدقّق صار مُدخَلاً إلى راتشتٍ يملكه المنفّذ** ⇒ فمجردُ هبوط مراجعةٍ يُحمرّ
      # الـCI. هذا المسبارُ يبني نسخةً، يُودِع فيها مراجعةً اصطناعيّةً تحمل كلَّ ما تصطاده العدّادات،
      # ثم يُشغّل قائمةَ الضوابط هناك — والقائمةُ تُقرأ من هذا الملفّ نفسِه (مصدرٌ واحد).
      - name: Landing probe — a landing review must leave the guards green
        id: gate_landing
        run: python3 tools/landing_probe.py --quiet
      - name: Real-data files must never be tracked
        id: gate_data_untracked
        # **مالكٌ واحد للقاعدة (مراجعة ٦٧):** كان هنا نمطٌ جذريٌّ خاصٌّ بالخطوة
        # (`^data/(local_sample|training|eval_pack)/`) ⇒ نسخةٌ متداخلةٌ (`data/data/local_sample/…`)
        # تفلت منه، وتفلت من الحارس في الوقت نفسه. فصارت الخطوةُ تستدعي قاعدةَ الحارس نفسَها.
        run: python3 tools/publish_guard.py --tracked-real-data

      - name: Amount-guard — the key/manifest must not be tracked (no secret needed)
        id: gate_amount_key
        run: python3 tools/amount_guard.py --tracking-audit

      - name: Amount-ratchet — a pushed baseline may never raise the threshold
        id: gate_amount_ratchet
        # مراجعة ٣٩/٣: **العتبةُ لا يضعها من يدفع ثمنها.** هذا الفحصُ بلا سرٍّ وبلا أدلّة:
        # يقرأ ملفَّين مُتتبَّعين فقط ⇒ فهو السطحُ الذي لا يستطيع دافعٌ محليٌّ تجاوزه بـ`--no-verify`.
        run: |
          git fetch --quiet origin main || true
          python3 tools/amount_guard.py --baseline-audit origin/main
