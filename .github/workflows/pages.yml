# The public story page (docs/CP1_STEPS.md, step 5), published with GitHub's own Pages actions.
# Started by hand only (workflow_dispatch): the live site changes when someone publishes a checkpoint,
# never while work is in progress (docs/SHOWCASE_PLAN.md section 4, condition 1).
# No `run:` step on purpose: nothing here is a gate, so nothing joins the gate registry (docs/GATES.md).
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
