# (audit P2-11). Two consequences followed from having only the loose file:
# a fresh `pip install` a month later could bring Gradio 6 and break 800 lines of
# untested interface, and upgrading sentence-transformers silently changes the
# embeddings — and therefore the retrieval order — for the same question.
